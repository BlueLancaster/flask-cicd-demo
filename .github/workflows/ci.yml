name: Flask CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bluelancaster/flask-cicd-demo

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      DATABASE_URL: postgresql://app_user:test_password@localhost:5432/flask_demo_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flask_demo_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d flask_demo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Initialize test database
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U app_user -d flask_demo_test < init.sql

      - name: Run tests
        run: python -m pytest

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add GCP VM to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.GCP_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to GCP
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} << EOF

          set -e

          NEW_IMAGE="ghcr.io/bluelancaster/flask-cicd-demo:${{ github.sha }}"

          echo "Deploying: \$NEW_IMAGE"

          OLD_IMAGE=\$(docker inspect \
            --format='{{.Config.Image}}' \
            flask-demo 2>/dev/null || true)

          echo "Current image: \$OLD_IMAGE"

          docker pull "\$NEW_IMAGE"

          docker stop flask-demo || true
          docker rm flask-demo || true

          docker run -d \
            --name flask-demo \
            -p 5000:5000 \
            "\$NEW_IMAGE"

          sleep 5

          if curl --fail --silent http://localhost:5000/health > /dev/null; then
            echo "Deployment successful"
          else
            echo "Health check failed"

            docker stop flask-demo || true
            docker rm flask-demo || true

            if [ -n "\$OLD_IMAGE" ]; then
              echo "Rolling back to: \$OLD_IMAGE"

              docker run -d \
                --name flask-demo \
                -p 127.0.0.1:5000:5000 \
                "\$OLD_IMAGE"

              sleep 5

              curl --fail http://localhost:5000/health

              echo "Rollback successful"
            else
              echo "No previous image available for rollback"
            fi

            exit 1
          fi

          EOF

  