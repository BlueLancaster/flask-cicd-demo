name: Flask CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bluelancaster/flask-cicd-demo

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            
  deploy:
  if: github.event_name == 'push'
  needs: ci
  runs-on: ubuntu-latest

  steps:
    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

    - name: Add GCP VM to known_hosts
      run: |
        ssh-keyscan -H "${{ secrets.GCP_HOST }}" >> ~/.ssh/known_hosts

    - name: Deploy to GCP
      run: |
        ssh -i ~/.ssh/deploy_key \
          ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} << EOF

        docker pull ghcr.io/bluelancaster/flask-cicd-demo:${{ github.sha }}

        docker stop flask-demo || true
        docker rm flask-demo || true

        docker run -d \
          --name flask-demo \
          -p 5000:5000 \
          ghcr.io/bluelancaster/flask-cicd-demo:${{ github.sha }}

        sleep 5

        curl --fail http://localhost:5000/health

        EOF

  